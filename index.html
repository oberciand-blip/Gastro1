html = """<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gastro objednávky</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="modeOverlay" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-6">
  <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl">
    <h1 class="text-4xl font-bold mb-6">🍔 Gastro systém</h1>
    <p class="text-gray-600 mb-8 text-lg">Vyber režim zařízení</p>

    <div class="space-y-4">
      <button type="button" onclick="setMode('staff')" class="w-full bg-green-600 hover:bg-green-700 text-white text-2xl font-bold py-5 rounded-2xl">
        🧾 Obsluha
      </button>

      <button type="button" onclick="setMode('kitchen')" class="w-full bg-black hover:bg-gray-800 text-white text-2xl font-bold py-5 rounded-2xl">
        👨‍🍳 Kuchyň / Monitor
      </button>
    </div>
  </div>
</div>

<div class="max-w-6xl mx-auto p-4">
  <div class="flex flex-col gap-6">

    <div id="staffPanel" class="bg-white rounded-3xl shadow-xl p-6 hidden">
      <div class="flex items-center justify-between gap-3 mb-6">
        <h1 class="text-3xl font-bold">🍔 Nová objednávka</h1>

        <button type="button"
                onclick="setMode('kitchen')"
                class="bg-black text-white px-4 py-3 rounded-2xl font-bold">
          👨‍🍳 Kuchyň
        </button>
      </div>

      <div class="grid grid-cols-1 gap-4">

        <div class="bg-yellow-100 rounded-2xl p-4 text-center">
          <div class="text-lg font-semibold">💰 Celková cena</div>
          <div id="totalPrice" class="text-4xl font-bold">0 Kč</div>
        </div>

        <div class="bg-gray-50 rounded-2xl p-4">
          <h2 class="text-2xl font-bold mb-4">➕ Přidat položku</h2>

          <div class="grid grid-cols-2 gap-3">
            <button type="button" onclick="addItem('Párek v rohlíku',30,true)"
              class="bg-white border rounded-2xl p-4 text-xl font-bold hover:bg-red-100">
              🌭 Párek<br><span class="text-base">30 Kč</span>
            </button>

            <button type="button" onclick="addItem('Grilovaný hermelín',60,false)"
              class="bg-white border rounded-2xl p-4 text-xl font-bold hover:bg-yellow-100">
              🧀 Hermelín<br><span class="text-base">60 Kč</span>
            </button>

            <button type="button" onclick="addItem('Burger',230,false)"
              class="bg-white border rounded-2xl p-4 text-xl font-bold hover:bg-orange-100">
              🍔 Burger<br><span class="text-base">230 Kč</span>
            </button>

            <button type="button" onclick="addItem('Palačinky',40,false)"
              class="bg-white border rounded-2xl p-4 text-xl font-bold hover:bg-pink-100">
              🥞 Palačinky<br><span class="text-base">40 Kč</span>
            </button>

            <button type="button" onclick="addItem('Grilované maso',140,false)"
              class="bg-white border rounded-2xl p-4 text-xl font-bold hover:bg-green-100 col-span-2">
              🍖 Grilované maso<br><span class="text-base">140 Kč</span>
            </button>
          </div>
        </div>

        <div class="bg-white border rounded-2xl p-4">
          <div class="flex items-center justify-between mb-4 gap-3">
            <h2 class="text-2xl font-bold">🛒 Aktuální objednávka</h2>

            <button type="button"
              onclick="resetOrderNumbers()"
              class="bg-red-600 text-white px-4 py-2 rounded-xl font-bold">
              🔄 Reset čísel
            </button>
          </div>

          <div id="currentOrder" class="space-y-3"></div>
        </div>

      </div>

      <div class="mt-6">
        <label class="font-semibold">Poznámka</label>
        <textarea id="poznamka" class="w-full mt-2 p-3 rounded-xl border text-xl" rows="3"></textarea>
      </div>

      <button type="button" onclick="sendOrder()" class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white text-2xl font-bold py-4 rounded-2xl">
        ➕ Odeslat objednávku
      </button>
    </div>

    <div id="kitchenPanel" class="bg-black text-white rounded-3xl shadow-xl p-6 min-h-screen hidden">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-6">
        <h2 class="text-3xl font-bold">👨‍🍳 Kuchyň</h2>

        <button type="button"
          onclick="setMode('staff')"
          class="bg-white text-black px-4 py-3 rounded-2xl font-bold">
          🧾 Obsluha
        </button>
      </div>

      <div id="orders" class="space-y-4"></div>
    </div>

  </div>
</div>

<script>
let currentItems = [];
let orderCounter = Number(localStorage.getItem('orderCounter') || '0');
let orders = JSON.parse(localStorage.getItem('orders') || '[]');

function setMode(mode) {
  localStorage.setItem('gastro_mode', mode);

  const overlay = document.getElementById('modeOverlay');
  if (overlay) overlay.remove();

  const staffPanel = document.getElementById('staffPanel');
  const kitchenPanel = document.getElementById('kitchenPanel');

  staffPanel.classList.add('hidden');
  kitchenPanel.classList.add('hidden');

  if(mode === 'staff'){
    staffPanel.classList.remove('hidden');
    document.body.classList.add('bg-gray-100');
    document.body.classList.remove('bg-black');
  } else {
    kitchenPanel.classList.remove('hidden');
    document.body.classList.remove('bg-gray-100');
    document.body.classList.add('bg-black');
    renderOrders();
  }
}

function addItem(name, price, hasSauce){
  currentItems.push({
    id: String(Date.now()) + String(Math.random()).slice(2),
    name,
    price,
    sauce: hasSauce ? 'kečup' : ''
  });

  renderCurrentOrder();
}

function removeItem(id){
  currentItems = currentItems.filter(item => item.id !== id);
  renderCurrentOrder();
}

function updateSauce(id, value){
  currentItems = currentItems.map(item => {
    if(item.id === id){
      item.sauce = value;
    }
    return item;
  });

  renderCurrentOrder();
}

function renderCurrentOrder(){
  const container = document.getElementById('currentOrder');
  const totalPrice = document.getElementById('totalPrice');

  if (!container || !totalPrice) return;

  container.innerHTML = '';

  let total = 0;

  if (currentItems.length === 0) {
    container.innerHTML = '<div class="text-gray-400 text-xl">Zatím nic v objednávce.</div>';
  }

  currentItems.forEach(item => {
    total += item.price;

    const div = document.createElement('div');
    div.className = 'bg-gray-100 rounded-2xl p-3';

    div.innerHTML = `
      <div class="flex justify-between items-center gap-3">
        <div>
          <div class="font-bold text-xl">${item.name}</div>
          <div>${item.price} Kč</div>
        </div>

        ${item.sauce !== '' ? `
        <select onchange="updateSauce('${item.id}', this.value)" class="p-2 rounded-xl border">
          <option ${item.sauce === 'kečup' ? 'selected' : ''}>kečup</option>
          <option ${item.sauce === 'hořčice' ? 'selected' : ''}>hořčice</option>
          <option ${item.sauce === 'oboje' ? 'selected' : ''}>oboje</option>
        </select>` : ''}

        <button type="button" onclick="removeItem('${item.id}')"
          class="bg-red-500 text-white px-4 py-2 rounded-xl">
          ✕
        </button>
      </div>
    `;

    container.appendChild(div);
  });

  totalPrice.innerText = total + ' Kč';
}

function sendOrder(){
  if(currentItems.length === 0){
    alert('Přidej položku');
    return;
  }

  orderCounter++;
  localStorage.setItem('orderCounter', String(orderCounter));

  const total = currentItems.reduce((sum,item)=>sum+item.price,0);

  const order = {
    id: String(Date.now()) + String(Math.random()).slice(2),
    number: orderCounter,
    items: currentItems.map(item => ({...item})),
    total,
    note: document.getElementById('poznamka').value,
    time: new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }),
    done: false
  };

  orders.push(order);
  localStorage.setItem('orders', JSON.stringify(orders));

  currentItems = [];
  renderCurrentOrder();
  document.getElementById('poznamka').value = '';

  alert('Objednávka #' + orderCounter + ' odeslána do kuchyně');
}

function renderOrders(){
  const container = document.getElementById('orders');
  if (!container) return;

  container.innerHTML = '';

  if (orders.length === 0) {
    container.innerHTML = '<div class="text-gray-400 text-2xl">Zatím žádné objednávky.</div>';
    return;
  }

  orders.slice().reverse().forEach(order => {
    const div = document.createElement('div');
    div.className = 'rounded-2xl p-4 ' + (order.done ? 'bg-green-700' : 'bg-gray-800');

    div.innerHTML = `
      <div class="flex justify-between items-center mb-3 gap-3">
        <div class="text-3xl font-bold">Objednávka #${order.number}</div>
        <div class="text-xl">${order.time}</div>
        <div class="text-yellow-300 text-3xl font-bold">${order.total} Kč</div>
      </div>

      <div class="space-y-2 text-2xl">
        ${order.items.map(item => `
          <div>• ${item.name} ${item.sauce ? '('+item.sauce+')' : ''}</div>
        `).join('')}
      </div>

      ${order.note ? `<div class="mt-3 text-yellow-300 text-xl">📝 ${order.note}</div>` : ''}

      ${order.done ? `
        <button type="button" onclick="deleteOrder('${order.id}')"
          class="mt-4 w-full py-3 rounded-xl text-xl font-bold bg-red-600">
          🗑️ Smazat objednávku
        </button>
      ` : `
        <button type="button" onclick="markDone('${order.id}')"
          class="mt-4 w-full py-3 rounded-xl text-xl font-bold bg-green-600">
          ✅ Označit jako hotové
        </button>
      `}
    `;

    container.appendChild(div);
  });
}

function markDone(id){
  orders = orders.map(order => {
    if(order.id === id) order.done = true;
    return order;
  });
  localStorage.setItem('orders', JSON.stringify(orders));
  renderOrders();
}

function deleteOrder(id){
  if(confirm('Opravdu smazat objednávku?')){
    orders = orders.filter(order => order.id !== id);
    localStorage.setItem('orders', JSON.stringify(orders));
    renderOrders();
  }
}

function resetOrderNumbers(){
  if(confirm('Opravdu resetovat čísla objednávek? Další objednávka bude #1.')){
    orderCounter = 0;
    localStorage.setItem('orderCounter', '0');
    alert('Čísla objednávek resetována');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  renderCurrentOrder();

  const savedMode = localStorage.getItem('gastro_mode');
  if(savedMode){
    setMode(savedMode);
  }
});
</script>

</body>
</html>
"""

path = Path("/mnt/data/gastro-oprava-prepinani.html")
path.write_text(html, encoding="utf-8")
print("created", path)
